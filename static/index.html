<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitchen Dashboard</title>
<style>
  /* Layout: header (clock | weather) / full-width day bar / schedule rows | slim to-do checklist */
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #f2f3f5; --muted: #8b919c; --soft: #c3c7cf;
    /* Event colors: time blocks (work) = rich plum, appointments = sage, anything else = slate */
    --block: #7a3f66; --block-lo: #5e2e4f; --block-text: #c993b8;
    --appt: #6f9d7e; --appt-lo: #5b866a; --appt-text: #9cc7a9;
    --other: #5d7fb0; --other-lo: #4c6a98; --other-text: #91aed8;
    --cell: #191c23; --cell-edge: #242833;
    --now: #ff5a5f; --rain: #5aa9ff; --bad: #f2555a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif; cursor: none; overflow: hidden; }
  body { display: flex; flex-direction: column; gap: 4.5vh; padding: 4vh 3.5vw; transition: opacity 2s; }
  body.night { opacity: 0.35; }
  h2 { font-size: 1.5vw; font-weight: 600; color: var(--muted); text-transform: uppercase;
       letter-spacing: 0.12em; margin: 0 0 1.6vh; }

  /* Header */
  header { display: flex; justify-content: space-between; align-items: center; }
  #time { font-size: 6vw; font-weight: 300; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  #date { font-size: 2.1vw; color: var(--muted); margin-top: 0.8vh; }
  #weather { display: flex; align-items: center; gap: 2.5vw; }
  .now-wx { display: flex; align-items: center; gap: 1vw; }
  .now-wx svg { width: 5.5vw; height: 5.5vw; }
  .temp { font-size: 5vw; font-weight: 300; line-height: 1; }
  .wx-detail { font-size: 1.5vw; color: var(--muted); line-height: 1.45; }
  .wx-detail b { color: var(--text); font-weight: 500; }
  .hours { display: flex; gap: 1.6vw; padding-left: 2.5vw; border-left: 1px solid var(--line); }
  .hour { text-align: center; }
  .hour .h { font-size: 1.2vw; color: var(--muted); }
  .hour svg { width: 2.6vw; height: 2.6vw; display: block; margin: 0.6vh auto; }
  .hour .t { font-size: 1.6vw; }
  .hour .p { font-size: 1.1vw; color: var(--rain); min-height: 1.4vw; }

  /* Day bar */
  #allday { display: flex; gap: 0.8vw; flex-wrap: wrap; }
  #allday:not(:empty) { margin-bottom: 1.4vh; }
  .chip { font-size: 1.5vw; padding: 0.6vh 1vw; border-radius: 0.6vw; background: var(--panel); border-left: 0.4vw solid var(--other); }
  /* One block per hour. Names sit above their first block; hour labels sit under their block.
     Blocks, names and hour labels all share the same left edge (block edge + GAP). */
  .bar-wrap { position: relative; margin-top: 8.5vh; }
  .bar { position: relative; height: 8vh; }
  .hc { position: absolute; top: 0; bottom: 0; border-radius: 0.55vw; overflow: hidden;
        background: var(--cell); box-shadow: inset 0 0 0 1px var(--cell-edge); }
  .hc.block { background: linear-gradient(var(--block), var(--block-lo)); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  .hc.appointment { background: linear-gradient(var(--appt), var(--appt-lo)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
  .hc.other { background: linear-gradient(var(--other), var(--other-lo)); box-shadow: inset 0 1px 0 rgba(255,255,255,.16); }
  .hc .shade { position: absolute; top: 0; bottom: 0; left: 0; background: rgba(12,14,18,.62); }
  .hlbl { position: absolute; bottom: calc(100% + 1.2vh); white-space: nowrap; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; }
  .hlbl .n { font-size: 2vw; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .hlbl .w { font-size: 1.35vw; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums;
             overflow: hidden; text-overflow: ellipsis; }
  .hlbl.block .n { color: var(--block-text); } .hlbl.appointment .n { color: var(--appt-text); } .hlbl.other .n { color: var(--other-text); }
  .hlbl.past .n { color: var(--muted); }
  .ticks { position: relative; height: 4vh; }
  .ticks span { position: absolute; top: 0.9vh; font-size: 1.25vw; color: var(--muted); white-space: nowrap; }
  .ticks span.last { transform: translateX(-100%); }
  .nowmark { position: absolute; top: 0.4vh; bottom: 4vh; width: 0; border-left: 3px solid var(--now); z-index: 3; }
  .nowmark::before { content: ""; position: absolute; left: -0.95vw; top: -1.6vh; width: 0; height: 0;
     border-left: 0.95vw solid transparent; border-right: 0.95vw solid transparent; border-top: 1.5vh solid var(--now); }

  /* Schedule + to-do */
  main { display: grid; grid-template-columns: 2.6fr 1fr; gap: 3vw; min-height: 0; flex: 1; }
  .col { min-width: 0; min-height: 0; }
  #schedule { display: flex; flex-direction: column; gap: 1.6vh; }
  .row { display: grid; grid-template-columns: 1.3vw 1fr auto; column-gap: 1.3vw; row-gap: 0.5vh; align-items: center;
         background: var(--panel); border-radius: 0.8vw; padding: 2vh 1.6vw; }
  .row .sw { width: 1.3vw; height: 1.3vw; border-radius: 0.3vw; grid-row: 1 / span 2; align-self: start; margin-top: 0.9vh; }
  .row .t { font-size: 2.4vw; font-weight: 600; line-height: 1.15; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .st { font-size: 1.5vw; color: var(--muted); white-space: nowrap; justify-self: end; }
  .row .m { grid-column: 2 / span 2; font-size: 1.6vw; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .m b { color: var(--text); font-weight: 700; font-variant-numeric: tabular-nums; }
  .row.past { opacity: 0.45; }
  #schedule.dense .row { padding: 1.2vh 1.4vw; row-gap: 0.2vh; }
  #schedule.dense .row .t { font-size: 2vw; } #schedule.dense .row .m { font-size: 1.4vw; }
  .more { font-size: 1.4vw; color: var(--muted); padding-left: 0.4vw; }
  ul.check { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2vh; }
  ul.check li { display: flex; align-items: center; gap: 1vw; font-size: 2vw; line-height: 1.2; }
  ul.check li::before { content: ""; flex: none; width: 1.4vw; height: 1.4vw; border: 2px solid var(--muted); border-radius: 0.25vw; }
  .empty { font-size: 1.8vw; color: var(--muted); }
  #error { position: fixed; left: 3.5vw; right: 3.5vw; bottom: 2vh; font-size: 1.4vw; color: var(--bad); }
</style>
</head>
<body>
  <header>
    <div><div id="time">--:--</div><div id="date"></div></div>
    <div id="weather"></div>
  </header>
  <section>
    <h2>Today</h2>
    <div id="allday"></div>
    <div class="bar-wrap"><div id="bar" class="bar"></div><div id="ticks" class="ticks"></div><div id="nowmark" class="nowmark"></div></div>
  </section>
  <main>
    <section class="col"><h2>Schedule</h2><div id="schedule"></div></section>
    <section class="col"><h2>To do</h2><ul class="check" id="todo"></ul></section>
  </main>
  <div id="error"></div>

<script>
const TZ = "America/Chicago";
const NIGHT_START = 23, NIGHT_END = 6;   // dim between 11 PM and 6 AM
const POLL_MS = 60 * 1000;
const MAX_ROWS = 4;                        // schedule rows before finished events are dropped from the list
const fmt = o => new Intl.DateTimeFormat("en-US", { timeZone: TZ, ...o });
const fClock = fmt({ hour: "numeric", minute: "2-digit" });
const fDate = fmt({ weekday: "long", month: "long", day: "numeric" });
const fHour = fmt({ hour: "numeric" });
const hoursOf = d => { const p = Object.fromEntries(fmt({ hour: "numeric", minute: "numeric", hourCycle: "h23" })
  .formatToParts(d).map(x => [x.type, x.value])); return Number(p.hour) % 24 + Number(p.minute) / 60; };
const hl = h => `${h % 12 || 12} ${h % 24 < 12 ? "AM" : "PM"}`;
const short = d => fClock.format(d).replace(":00", "");
const range = (s, e) => { const a = short(s), b = short(e); return (a.slice(-2) === b.slice(-2) ? a.slice(0, -3) : a) + "–" + b; };
const dur = ms => { const m = Math.max(1, Math.round(ms / 60000)), h = Math.floor(m / 60);
  return [h ? h + " h" : "", m % 60 ? (m % 60) + " m" : ""].filter(Boolean).join(" "); };
// "Golf - X-Golf American Family Field" with that location -> "Golf", venue on the second line
const split = e => { const [a, ...b] = e.title.split(" - "); const rest = b.join(" - ");
  return rest && (!e.location || rest === e.location) ? [a, rest] : [e.title, e.location]; };
const KIND_COLOR = { block: "linear-gradient(var(--block), var(--block-lo))",
                     appointment: "linear-gradient(var(--appt), var(--appt-lo))",
                     other: "linear-gradient(var(--other), var(--other-lo))" };
const $ = id => document.getElementById(id);
let data = null;

// ---- weather icons (inline SVG; the Pi has no emoji font) ----
const SUN = '<circle cx="32" cy="32" r="11" fill="#f5c84c"/><g stroke="#f5c84c" stroke-width="4" stroke-linecap="round">' +
  [0,45,90,135,180,225,270,315].map(a => `<line x1="32" y1="9" x2="32" y2="15" transform="rotate(${a} 32 32)"/>`).join("") + "</g>";
const CLOUD = (y = 0) => `<path transform="translate(0 ${y})" fill="#c9ced8" d="M18 48h28a10 10 0 0 0 1-20 14 14 0 0 0-27-3 10 10 0 0 0-2 23z"/>`;
const ICONS = {
  sun: SUN,
  moon: '<path fill="#d9dce3" d="M40 10a22 22 0 1 0 14 34A18 18 0 0 1 40 10z"/>',
  cloud: CLOUD(),
  partly: '<g transform="translate(-6 -8) scale(0.8)">' + SUN + "</g>" + CLOUD(4),
  fog: '<g stroke="#c9ced8" stroke-width="4" stroke-linecap="round"><line x1="12" y1="24" x2="52" y2="24"/><line x1="8" y1="34" x2="56" y2="34"/><line x1="14" y1="44" x2="50" y2="44"/></g>',
  rain: CLOUD(-6) + '<g stroke="#5aa9ff" stroke-width="3.5" stroke-linecap="round"><line x1="22" y1="48" x2="19" y2="56"/><line x1="32" y1="48" x2="29" y2="56"/><line x1="42" y1="48" x2="39" y2="56"/></g>',
  snow: CLOUD(-6) + '<g fill="#ffffff"><circle cx="21" cy="52" r="2.6"/><circle cx="32" cy="55" r="2.6"/><circle cx="43" cy="52" r="2.6"/></g>',
  storm: CLOUD(-6) + '<path fill="#f5c84c" d="M33 40l-8 12h6l-3 10 10-14h-6l3-8z"/>',
};
const icon = name => `<svg viewBox="0 0 64 64">${ICONS[name] || ICONS.cloud}</svg>`;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function tick() {
  const now = new Date();
  $("time").textContent = fClock.format(now).replace(/\s?[AP]M$/, "");
  $("date").textContent = fDate.format(now);
  const h = hoursOf(now);
  document.body.classList.toggle("night", h >= NIGHT_START || h < NIGHT_END);
}

function renderWeather(w) {
  const box = $("weather");
  if (!w || w.error) { box.innerHTML = '<div class="wx-detail">Weather unavailable</div>'; return; }
  const rain = w.pop >= 20 ? ` · <span style="color:var(--rain)">${w.pop}% rain</span>` : "";
  box.innerHTML =
    `<div class="now-wx">${icon(w.icon)}<div class="temp">${w.temp}°</div></div>
     <div class="wx-detail"><b>${w.label}</b><br>Feels ${w.feels}° · Wind ${w.wind} mph<br>
       High <b>${w.high}°</b> · Low <b>${w.low}°</b>${rain}</div>
     <div class="hours">${w.hours.map(h => `<div class="hour"><div class="h">${fHour.format(new Date(h.time))}</div>
       ${icon(h.icon)}<div class="t">${h.temp}°</div><div class="p">${h.pop >= 20 ? h.pop + "%" : ""}</div></div>`).join("")}</div>`;
}

function events() {
  return (data.events || []).map(e => ({ ...e, s: new Date(e.start), e: new Date(e.end) })).sort((a, b) => a.s - b.s);
}

function renderDay() {
  const evs = events(), now = new Date(), nowH = hoursOf(now);
  // Range: at least 7 AM–10 PM, stretched for early/late events, always including now.
  let lo = 7, hi = 22;
  for (const e of evs) { lo = Math.min(lo, Math.floor(hoursOf(e.s))); hi = Math.max(hi, Math.ceil(hoursOf(e.e) || 24)); }
  lo = Math.max(0, Math.min(lo, Math.floor(nowH))); hi = Math.min(24, Math.max(hi, Math.ceil(nowH + 0.01)));
  const x = h => ((h - lo) / (hi - lo)) * 100;
  const GAP = 2;                                            // px between hour blocks, half on each side
  const edge = h => `calc(${x(h)}% + ${GAP}px)`;            // left edge shared by a block, its name and its hour label
  const startH = e => Math.max(lo, hoursOf(e.s)), endH = e => Math.min(hi, hoursOf(e.e) || 24);
  const RANK = { appointment: 3, other: 2, block: 1 };      // when events share an hour, the appointment colors it

  const bar = $("bar");
  bar.replaceChildren();
  for (let h = lo; h < hi; h++) {
    // An hour takes the color of the highest-ranked event covering at least 15 minutes of it.
    const cover = evs.filter(e => Math.min(endH(e), h + 1) - Math.max(startH(e), h) >= 0.25)
                     .sort((a, b) => RANK[b.kind] - RANK[a.kind])[0];
    const c = el("div", "hc" + (cover ? " " + cover.kind : ""));
    Object.assign(c.style, { left: edge(h), width: `calc(${x(h + 1) - x(h)}% - ${2 * GAP}px)` });
    const done = Math.max(0, Math.min(1, nowH - h));        // dim exactly up to now
    if (done > 0) { const s = el("div", "shade"); s.style.width = done * 100 + "%"; c.append(s); }
    bar.append(c);
  }

  // Names above the block where each event starts. If a name would run into the previous one,
  // it moves up a row (up to 3 rows); only if every row is taken does it get trimmed with "…".
  const labels = evs.filter(e => endH(e) > lo && startH(e) < hi);
  const placed = [];                                          // {el, row, left, right}
  for (const e of labels) {
    const h = Math.floor(startH(e));
    const l = el("div", "hlbl " + e.kind + (e.e <= now ? " past" : ""));
    l.style.left = edge(h);
    l.style.maxWidth = `calc(${100 - x(h)}% - ${GAP}px)`;
    l.append(el("div", "n", split(e)[0]), el("div", "w", range(e.s, e.e)));
    bar.append(l);
    placed.push({ el: l });
  }
  const rowEnds = [], ROWS = 3, PAD = 16;
  let rowH = 0, rowsUsed = 1;
  for (const p of placed) {
    const r = p.el.getBoundingClientRect();
    rowH = Math.max(rowH, r.height);
    let row = rowEnds.findIndex(end => r.left >= end + PAD);
    if (row < 0 && rowEnds.length < ROWS) row = rowEnds.length;
    if (row < 0) {                                            // all rows busy: trim the name in the emptiest row
      row = rowEnds.indexOf(Math.min(...rowEnds));
      const prev = placed.filter(q => q.row === row).pop();
      if (prev) prev.el.style.maxWidth = Math.max(40, r.left - prev.left - PAD) + "px";
    }
    rowEnds[row] = r.right;
    Object.assign(p, { row, left: r.left });
    rowsUsed = Math.max(rowsUsed, row + 1);
  }
  const vh = window.innerHeight / 100;
  for (const p of placed) p.el.style.bottom = `calc(100% + ${1.2 * vh + p.row * (rowH + 0.6 * vh)}px)`;
  document.querySelector(".bar-wrap").style.marginTop = `${8.5 * vh + (rowsUsed - 1) * (rowH + 0.6 * vh)}px`;

  // Hour labels, left-aligned under their block like the names above.
  const step = hi - lo > 16 ? 3 : 2, ticks = $("ticks");
  ticks.replaceChildren();
  for (let h = lo; h <= hi; h += step) {
    const t = el("span", h === hi ? "last" : "", hl(h));
    t.style.left = h === hi ? `calc(${x(h)}% - ${GAP}px)` : edge(h);
    ticks.append(t);
  }
  $("nowmark").style.left = x(nowH) + "%";

  const ad = $("allday"); ad.replaceChildren();
  for (const a of data.all_day || []) ad.append(el("div", "chip", a.title));

  // Schedule rows: drop finished events when the day is busy, compact when crowded,
  // and show only as many rows as fit on screen, then "+ N more later".
  const list = evs.length > MAX_ROWS ? evs.filter(e => e.e > now) : evs;
  const box = $("schedule");
  box.replaceChildren();
  box.classList.toggle("dense", list.length > 3);
  if (!evs.length) box.append(el("div", "empty", "Nothing scheduled today"));
  for (const e of list) {
    const [title, venue] = split(e);
    const row = el("div", "row" + (e.e <= now ? " past" : ""));
    const sw = el("div", "sw"); sw.style.background = KIND_COLOR[e.kind] || KIND_COLOR.other;
    const m = el("div", "m"); const b = el("b", "", range(e.s, e.e)); m.append(b);
    if (venue) m.append(" · " + venue);
    row.append(sw, el("div", "t", title),
      el("div", "st", e.e <= now ? "Done" : e.s <= now ? `Now · ${dur(e.e - now)} left` : `in ${dur(e.s - now)}`), m);
    box.append(row);
  }
  const rows = [...box.querySelectorAll(".row")];
  const bottom = window.innerHeight * 0.98;                    // keep a small bottom margin
  const keep = rows.findIndex((r, i) => r.getBoundingClientRect().bottom >
                 bottom - (i < rows.length - 1 ? 4.5 * window.innerHeight / 100 : 0));   // room for "+ N more"
  if (keep >= 0) {
    const cut = Math.max(1, keep);
    rows.slice(cut).forEach(r => r.remove());
    box.append(el("div", "more", `+ ${rows.length - cut} more later`));
  }
}

function renderTodo() {
  const box = $("todo"); box.replaceChildren();
  const tasks = data.tasks || [];
  if (!tasks.length) box.append(el("div", "empty", "Nothing to do today"));
  for (const t of tasks) box.append(el("li", "", t.title));
}

async function refresh() {
  const err = $("error");
  try {
    const res = await fetch("/api/today", { cache: "no-store" });
    data = await res.json();
    err.textContent = data.ok ? "" : "Google connection problem: " + (data.error || "unknown");
    renderWeather(data.weather); renderDay(); renderTodo();
  } catch (e) {
    err.textContent = "Dashboard service not responding";
  }
}

tick(); refresh();
setInterval(tick, 1000);
setInterval(refresh, POLL_MS);
setInterval(() => data && renderDay(), 30 * 1000);   // keep the now-marker and "in X" moving
setTimeout(() => location.reload(), 6 * 3600 * 1000);
</script>
</body>
</html>
