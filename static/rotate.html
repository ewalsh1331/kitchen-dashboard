<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kitchen Dashboard</title>
<style>
  html, body { margin: 0; height: 100%; background: #0f1115; overflow: hidden; cursor: none; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    opacity: 0; transition: opacity 1.2s ease; }
  iframe.on { opacity: 1; }
</style>
</head>
<body>
<script>
// Cycles through the pages listed in config.json "rotation".
// Each page stays loaded (and keeps refreshing itself); only visibility changes.
(async () => {
  let pages = [{ page: "/", seconds: 45 }, { page: "/month", seconds: 30 }];
  try {
    const res = await fetch("/api/rotation", { cache: "no-store" });
    const cfg = await res.json();
    if (Array.isArray(cfg) && cfg.length) pages = cfg;
  } catch (e) { /* keep defaults */ }

  const frames = pages.map(p => {
    const f = document.createElement("iframe");
    f.src = p.page;
    document.body.append(f);
    return f;
  });

  let i = 0;
  const show = () => {
    frames.forEach((f, n) => f.classList.toggle("on", n === i));
    const secs = Math.max(5, Number(pages[i].seconds) || 30);
    if (frames.length > 1) setTimeout(() => { i = (i + 1) % frames.length; show(); }, secs * 1000);
  };
  show();
  setTimeout(() => location.reload(), 6 * 3600 * 1000);
})();
</script>
</body>
</html>
